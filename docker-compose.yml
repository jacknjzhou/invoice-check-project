services:
  postgres:
    image: postgres:15-alpine
    container_name: invoice_agent_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-invoice_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - invoice_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice_agent_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-invoice_agent}
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost,http://localhost:80
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # 容器内访问宿主机上的 Ollama / 其他 LLM 服务
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - invoice_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoice_agent_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - invoice_network

volumes:
  postgres_data:
    driver: local
  backend_data:
    driver: local

networks:
  invoice_network:
    driver: bridge
